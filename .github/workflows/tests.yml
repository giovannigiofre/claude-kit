name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every self-check (standard library only, no tokens)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          failed=0
          for t in tests/test_*.py plugins/*/hooks/tests/test_*.py plugins/*/skills/*/tests/test_*.py; do
            echo "::group::$t"
            python3 "$t" || failed=1
            echo "::endgroup::"
          done
          exit $failed
